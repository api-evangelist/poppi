domain_standard:
  id: ucp
  name: Universal Commerce Protocol (UCP)
  conforms: true
  version: '2026-04-08'
  also_supported: ['2026-01-23']
  spec: https://ucp.dev/2026-04-08/specification/overview/
  declaration: https://drinkpoppi.com/.well-known/ucp
  signature: >-
    The merchant profile declares the UCP service namespace dev.ucp.shopping with transport "mcp" and the
    capability set dev.ucp.shopping.checkout, .fulfillment, .discount, .cart, .order, .catalog.search and
    .catalog.lookup, each bound to a published ucp.dev JSON Schema. The response header
    x-shopify-ucp-mcp-api-version: 2026-04-08 confirms the deployed version at runtime.
  extensions:
  - id: dev.shopify.catalog
    spec: https://shopify.dev/docs/agents/catalog/storefront-catalog
    extends: [dev.ucp.shopping.catalog.search, dev.ucp.shopping.catalog.lookup]
  payment_handlers:
  - com.google.pay (gpay, 2026-01-11)
  - dev.shopify.card (2026-01-15)
  - dev.shopify.shop_pay (2026-04-08)
  buyer_reality: >-
    An agent that already speaks UCP can transact with poppi with no bespoke connector — discover at
    /.well-known/ucp, search, cart, check out and complete with buyer approval. This is the difference the
    domain_standard_conformance dimension exists to draw, and poppi is on the conformant side of it by
    virtue of running on Shopify's UCP-native commerce stack.
compliance_program:
  published: false
  note: >-
    No trust center, no named certifications, no security.txt. poppi's privacy policy and terms of service
    are the only published legal surface. No Compliance pointer emitted.
