apis:
- aid: poppi-agentic-commerce
  name: Poppi Agentic Commerce (UCP / MCP)
  description: >-
    The agent-facing commerce surface for the poppi online store. An anonymous Model Context Protocol
    endpoint implementing the Universal Commerce Protocol (UCP) shopping service, exposing catalog search
    and lookup, cart, checkout and order tools. Buyer approval is required for payment and complete_checkout
    requires an idempotency key. Served by Shopify on poppi's own domain; the UCP profile identifies the
    merchant as poppi (drinkpoppi.com, shop 22399731, mother-beverage.myshopify.com).
  humanURL: https://drinkpoppi.com/agents.md
  baseURL: https://drinkpoppi.com/api/ucp/mcp
  tags:
  - Agentic Commerce
  - MCP
  - Ecommerce
  - Catalog
  - Checkout
  properties:
  - type: MCPServer
    url: mcp/poppi-mcp.yml
  - type: Documentation
    url: https://drinkpoppi.com/agents.md
  - type: Authentication
    url: authentication/poppi-authentication.yml
  - type: Conventions
    url: conventions/poppi-conventions.yml
  - type: Idempotency
    url: conventions/poppi-conventions.yml
  - type: RateLimits
    url: rate-limits/poppi-rate-limits.yml
  - type: DataModel
    url: data-model/poppi-data-model.yml
  - type: ToolCrosswalk
    url: mcp/poppi-tool-crosswalk.yml
- aid: poppi-storefront-graphql
  name: Poppi Storefront GraphQL API
  description: >-
    The Shopify Storefront GraphQL API as deployed on poppi's own domain — 34 query fields, 41 mutations
    and 420 types covering products, collections, search, carts, content and customer accounts.
    Introspection is open and anonymous; a live query returns shop.name "poppi" with primaryDomain
    https://drinkpoppi.com. The schema is Shopify's platform schema; the instance and its data are poppi's.
  humanURL: https://shopify.dev/docs/api/storefront
  baseURL: https://drinkpoppi.com/api/2026-07/graphql.json
  tags:
  - GraphQL
  - Ecommerce
  - Catalog
  - Cart
  properties:
  - type: GraphQL
    url: graphql/poppi-graphql.yml
  - type: SchemaDefinition
    url: graphql/poppi-storefront.graphql
  - type: Documentation
    url: https://shopify.dev/docs/api/storefront
