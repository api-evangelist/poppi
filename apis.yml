aid: poppi
name: Poppi
description: >-
  Poppi is an American prebiotic soda brand founded in Austin, Texas by Stephen and Allison Ellsworth,
  originally as Mother Beverage, rebranded to poppi in 2020 after a Shark Tank investment and acquired by
  PepsiCo in May 2025. Poppi sells direct to consumers from drinkpoppi.com, a Shopify storefront, and that
  storefront is where its machine-readable surface lives: poppi publishes agent instructions at /agents.md
  and /llms.txt, a Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, and an anonymous
  remote MCP endpoint at /api/ucp/mcp exposing 13 catalog, cart, checkout and order tools with full JSON
  Schema input contracts. Poppi is not a software vendor and ships no developer program, SDKs or OpenAPI —
  its API surface is the Shopify-native agentic-commerce stack served on and scoped to its own domain.
